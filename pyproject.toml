[project]
name = "robot-agent"
version = "0.1.0"
description = "Minimal closed-loop robotics agent: LLM tool calling over a mock tabletop env"
authors = [
    { name = "jpeng", email = "jonathan.peng09@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.14.0",
]

[project.scripts]
robot-agent = "robot_agent.cli:main"

[build-system]
requires = ["uv_build>=0.9.11,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
